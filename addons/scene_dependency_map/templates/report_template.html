<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__SDM_TITLE__</title>
<style>
:root{color-scheme:dark}body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee}
header{padding:16px 20px;background:#1b1b1b;border-bottom:3px solid #c1272d}
h1{margin:0 0 6px;font-size:22px}.sub{color:#bbb}
main{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 90px)}
aside{padding:14px;border-right:1px solid #333;overflow:auto;max-height:calc(100vh - 90px)}
section{margin-bottom:18px}h2{font-size:15px;color:#ff6b6b;margin:0 0 8px}
input,select{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:7px;width:100%;box-sizing:border-box;margin-bottom:8px}
.item{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;word-break:break-all}
.item:hover,.item.sel{background:#2a2a2a}.risk{color:#ffb3b3}.ok{color:#9fd69f}
#graph{overflow:auto;background:#181818;background-image:radial-gradient(#2a2a2a 1px,transparent 1px);background-size:22px 22px}
svg{display:block} .node{cursor:pointer} .node text{fill:#eee;font-size:11px}
.legend span{display:inline-block;margin-right:10px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#detail{font-size:13px;white-space:pre-wrap;word-break:break-all;background:#1d1d1d;padding:10px;border-radius:8px;min-height:60px}
label{font-size:13px;display:block;margin:4px 0}
</style></head><body>
<header><h1>🔗 Scene Dependency Map</h1><div class="sub" id="summary"></div>
<div class="legend" style="margin-top:8px">
<span><i class="dot" style="background:#e05252"></i>Scene</span><span><i class="dot" style="background:#528ee0"></i>Script</span><span><i class="dot" style="background:#e0a852"></i>Resource</span><span><i class="dot" style="background:#62c370"></i>Asset</span><span><i class="dot" style="background:#b07fe0"></i>Autoload</span><span><i class="dot" style="background:#888"></i>Other</span></div></header>
<main><aside>
<input id="q" type="search" placeholder="Search files…" aria-label="Search files">
<label><input type="checkbox" id="riskOnly" style="width:auto"> Show risky / unused only</label>
<section><h2>⚠ Missing files</h2><div id="missing"></div></section>
<section><h2>🧹 Unused files</h2><div id="unused"></div></section>
<section><h2>🔁 Cycles</h2><div id="cycles"></div></section>
<section><h2>⛓ Deep chains</h2><div id="deep"></div></section>
<section><h2>🎯 Hubs &amp; autoload risks</h2><div id="hubs"></div></section>
<section><h2>Details</h2><div id="detail">Click any file or graph node.</div></section>
</aside><div id="graph"></div></main>
<script>
const D=__SDM_DATA__;
const colors={scene:'#e05252',script:'#528ee0',resource:'#e0a852',asset:'#62c370',project:'#ddd',other:'#888'};
const unusedSet=new Set(D.unused.map(u=>u.path)), missingTo=new Set(D.missing.map(m=>m.to));
const risky=new Set([...unusedSet,...missingTo]); D.cycles.flat().forEach(p=>risky.add(p)); D.hubs.forEach(h=>risky.add(h.path));
document.getElementById('summary').textContent=`${D.summary.files} files · ${D.summary.edges} links · ${D.unused.length} unused · ${D.missing.length} missing · ${D.cycles.length} cycles · ${D.deep_chains.length} deep chains · main scene: ${D.main_scene||'(none set)'}`;
function list(id,items,fmt){const el=document.getElementById(id);el.innerHTML=items.length?items.map(fmt).join(''):'<div class="item ok">None ✓</div>'}
list('missing',D.missing,m=>`<div class="item risk" data-p="${m.to}">❌ ${m.from} → missing ${m.to}</div>`);
list('unused',D.unused,u=>`<div class="item" data-p="${u.path}">🧹 ${u.path}<br><small>${u.reason}</small></div>`);
list('cycles',D.cycles,c=>`<div class="item risk" data-p="${c[0]}">🔁 ${c.join(' → ')}</div>`);
list('deep',D.deep_chains,d=>`<div class="item risk" data-p="${d.chain[0]}">⛓ ${d.length} steps: ${d.chain.join(' → ')}</div>`);
list('hubs',[...D.hubs.map(h=>({path:h.path,t:h.detail})),...D.autoload_risks.map(h=>({path:h.path,t:h.detail}))],h=>`<div class="item risk" data-p="${h.path}">🎯 ${h.path}<br><small>${h.t}</small></div>`);
function render(){
 const q=document.getElementById('q').value.toLowerCase(), ro=document.getElementById('riskOnly').checked;
 const nodes=D.nodes.filter(n=>(!q||n.path.toLowerCase().includes(q))&&(!ro||risky.has(n.path)));
 const keep=new Set(nodes.map(n=>n.path)); const edges=D.edges.filter(e=>keep.has(e.from)&&keep.has(e.to)&&e.from!==e.to);
 // layered layout by longest distance from an entry point
 const depth={}; const bfs=[...D.entry_points]; D.entry_points.forEach(p=>depth[p]=0);
 while(bfs.length){const cur=bfs.shift(); for(const e of D.edges.filter(x=>x.from===cur)){if(depth[e.to]===undefined){depth[e.to]=depth[cur]+1;bfs.push(e.to)}}}
 const layers={}; nodes.forEach(n=>{const d=depth[n.path]??(99); (layers[d]??=[]).push(n)});
 const W=Math.max(900,Object.keys(layers).length*280), H=Math.max(600,...Object.values(layers).map(a=>a.length*54+40));
 const pos={}; Object.entries(layers).forEach(([d,arr])=>arr.forEach((n,i)=>pos[n.path]={x:30+d*280,y:30+i*54}));
 let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
 s+=edges.map(e=>{const a=pos[e.from],b=pos[e.to];return `<line x1="${a.x+190}" y1="${a.y+16}" x2="${b.x}" y2="${b.y+16}" stroke="${e.kind==='autoload_ref'?'#b07fe0':'#555'}" stroke-width="1.5"/>`}).join('');
 s+=nodes.map(n=>{const p=pos[n.path],c=n.is_autoload?'#b07fe0':(colors[n.type]||'#888'),bad=risky.has(n.path);
  return `<g class="node" data-p="${n.path}"><rect x="${p.x}" y="${p.y}" width="190" height="32" rx="7" fill="#222" stroke="${bad?'#ff4444':c}" stroke-width="${bad?2.5:1.5}"/><circle cx="${p.x+13}" cy="${p.y+16}" r="6" fill="${c}"/><text x="${p.x+25}" y="${p.y+20}">${n.name.length>24?n.name.slice(0,23)+'…':n.name}${n.is_autoload?' ★':''}${unusedSet.has(n.path)?' 🧹':''}</text></g>`}).join('');
 document.getElementById('graph').innerHTML=s+'</svg>';
 document.querySelectorAll('.node,.item[data-p]').forEach(el=>el.onclick=()=>show(el.dataset.p));
}
function show(p){const n=D.nodes.find(x=>x.path===p); if(!n)return;
 const ins=D.edges.filter(e=>e.to===p), outs=D.edges.filter(e=>e.from===p);
 document.getElementById('detail').textContent=`${n.path}\nType: ${n.type}${n.is_autoload?' · Autoload: '+n.autoload_name:''}${n.is_entry?' · Entry point':''}\nReachable from an entry point: ${n.reachable?'yes':'NO'}\nDepends on (${outs.length}):\n${outs.map(e=>'  → '+e.to+' ['+e.kind+']').join('\n')||'  (nothing)'}\nDepended on by (${ins.length}):\n${ins.map(e=>'  ← '+e.from+' ['+e.kind+']').join('\n')||'  (nothing)'}`}
document.getElementById('q').oninput=render; document.getElementById('riskOnly').onchange=render; render();
</script></body></html>
